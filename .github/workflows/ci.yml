name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test class names to run instead of the full spring-boot-autoconfigure suite (empty = full module build)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
            name: Linux
          - id: windows-latest
            name: Windows
        java:
          - version: 17
            toolchain: false
          - version: 21
            toolchain: true
          - version: 22
            toolchain: true
          - version: 23
            toolchain: true
        exclude:
          - os:
              name: Linux
            java:
              version: 17
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build
        id: build
        uses: ./.github/actions/build
        env:
          SEAL_TEST_FILTER: ${{ inputs.test-filter }}
        with:
          java-version: ${{ matrix.java.version }}
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-toolchain: ${{ matrix.java.toolchain }}
          java-distribution: ${{ matrix.java.distribution }}
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
          build-tasks: ${{ inputs.test-filter != '' && ':spring-boot-project:spring-boot-autoconfigure:assemble :spring-boot-project:spring-boot-autoconfigure:test :spring-boot-project:spring-boot-autoconfigure:dockerTest' || ':spring-boot-project:spring-boot-autoconfigure:build' }}
