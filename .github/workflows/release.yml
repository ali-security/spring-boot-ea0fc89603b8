name: Release
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test class names to run instead of the full spring-boot-autoconfigure suite (empty = full module build)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-stage-release:
    name: Build and Stage Release
    runs-on: ${{ vars.UBUNTU_MEDIUIM || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        env:
          SEAL_TEST_FILTER: ${{ inputs.test-filter }}
        with:
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
          publish: true
          build-tasks: ${{ inputs.test-filter != '' && ':spring-boot-project:spring-boot-autoconfigure:assemble :spring-boot-project:spring-boot-autoconfigure:test :spring-boot-project:spring-boot-autoconfigure:dockerTest' || ':spring-boot-project:spring-boot-autoconfigure:build' }}
          publish-tasks: ':spring-boot-project:spring-boot-autoconfigure:publishAllPublicationsToDeploymentRepository'
      - name: Upload Release Jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-autoconfigure-jar
          path: |
            deployment-repository/org/springframework/boot/spring-boot-autoconfigure/*/spring-boot-autoconfigure-*.jar
            !deployment-repository/**/*-sources.jar
            !deployment-repository/**/*-javadoc.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
